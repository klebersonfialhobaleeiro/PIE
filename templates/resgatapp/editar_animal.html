{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block 'title' %}Editar Animal{% endblock %}

{% block 'body' %}
<div class="container">
    <h2>Editar Animal</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                {{ field|as_crispy_field }}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary mb-3">Salvar alterações</button>
    </form>
</div>
{% endblock %}
